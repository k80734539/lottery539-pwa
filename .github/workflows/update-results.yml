name: update-results

# 台灣時間 = UTC+8。開獎約 20:30，主排程 21:35（UTC 13:35），再加兩個備援與隔天早上補抓。
on:
  schedule:
    - cron: '35 13 * * 1-6'   # 週一至週六 21:35 台灣時間
    - cron: '30 14 * * 1-6'   # 備援：22:30
    - cron: '45 15 * * 1-6'   # 備援：23:45
    - cron: '10 0 * * *'      # 隔天 08:10 補抓
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch results
        run: python scripts/update_results.py --months 2
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "data: update draw results $(TZ=Asia/Taipei date +%F)"
            git push
          else
            echo "No changes."
          fi
